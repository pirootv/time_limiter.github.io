<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保護者管理ダッシュボード v1.0.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }
        .card {
            background-color: #334155;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #94a3b8;
        }
        .status-display {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .status-blocked {
            background-color: #991b1b;
            color: #fca5a5;
        }
        .status-allowed {
            background-color: #166534;
            color: #86efac;
        }
        .usage-text {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        .btn-success {
            background-color: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background-color: #16a34a;
        }
        .btn-primary {
            background-color: #0284c7;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0369a1;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .schedule-table th, .schedule-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #475569;
        }
        .schedule-table input {
            background-color: #1e293b;
            border: 1px solid #64748b;
            color: white;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            width: 90%;
        }
        .pwd-input {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid #64748b;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Raspi Limiter 管理ダッシュボード</h1>

    <!-- リアルタイムステータスカード -->
    <div class="card">
        <div class="card-title">現在のステータス</div>
        <div id="statusBox" class="status-display status-allowed">データ読み込み中...</div>
        <div class="usage-text" id="usageBox">本日の利用時間: --分 --秒</div>

        <div class="btn-group">
            <!-- ブロックされていない時のみ表示 -->
            <button id="btnBlock" class="btn-danger" style="display: none;" onclick="setBlockState(true)">画面をブロック</button>
            
            <!-- ブロックされている時のみ表示 -->
            <button id="btnUnblock" class="btn-success" style="display: none;" onclick="setBlockState(false)">ブロック解除</button>
            
            <!-- 遠隔シャットダウンボタン -->
            <button id="btnShutdown" class="btn-primary" style="background-color: #7c3aed;" onclick="triggerRemoteShutdown()">電源オフ (遠隔シャットダウン)</button>
        </div>
    </div>

    <!-- 設定パスワード変更 -->
    <div class="card">
        <div class="card-title">パスワード設定</div>
        <input type="password" id="pwdInput" class="pwd-input" placeholder="新しいパスワードを入力">
    </div>

    <!-- スケジュール設定カード -->
    <div class="card">
        <div class="card-title">曜日別制限スケジュール</div>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>曜日</th>
                    <th>上限 (分)</th>
                    <th>禁止開始</th>
                    <th>禁止終了</th>
                </tr>
            </thead>
            <tbody id="scheduleBody">
                <!-- JavaScriptで動的生成 -->
            </tbody>
        </table>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <button class="btn-primary" style="width: 100%; padding: 16px; font-size: 18px;" onclick="saveConfig()">🚀 設定を保存して適用</button>
    </div>
</div>

<script>
    const BIN_ID = "6a8ed91cda38895dfe130781";
    const API_KEY = "$2a$10$cYHxQFVmqDI0vyGYEnYs4.UnliXoDQjli24.bTC0u0p3NZehV.uMG";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const dayNames = { "Mon": "月曜日", "Tue": "火曜日", "Wed": "水曜日", "Thu": "木曜日", "Fri": "金曜日", "Sat": "土曜日", "Sun": "日曜日" };

    let currentRecord = {};

    // 1. スケジュールテーブル初期構築
    function buildScheduleTable() {
        const tbody = document.getElementById("scheduleBody");
        tbody.innerHTML = "";
        days.forEach(day => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${dayNames[day]}</strong></td>
                <td><input type="number" id="max_${day}" value="0" min="0"></td>
                <td><input type="time" id="start_${day}"></td>
                <td><input type="time" id="end_${day}"></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 2. クラウドからデータを取得して画面を更新 (リロード時 & 自動同期)
    async function fetchConfig() {
        try {
            const res = await fetch(`${API_URL}/latest`, {
                headers: { "X-Master-Key": API_KEY }
            });
            if (!res.ok) return;
            
            const data = await res.json();
            currentRecord = data.record || {};

            updateUI(currentRecord);
        } catch (err) {
            console.error("Fetch error:", err);
        }
    }

    // 3. UI画面の描画更新
    function updateUI(record) {
        // 利用時間の反映 (0リセットバグ回避)
        const usedSec = record.used_seconds || 0;
        const mins = Math.floor(usedSec / 60);
        const secs = usedSec % 60;
        document.getElementById("usageBox").innerText = `本日の利用時間: ${mins}分 ${secs}秒`;

        // ブロック状態の反映とボタン表示切替 (トグル制御)
        const isBlocked = record.is_blocked || false;
        const statusBox = document.getElementById("statusBox");
        const btnBlock = document.getElementById("btnBlock");
        const btnUnblock = document.getElementById("btnUnblock");

        if (isBlocked) {
            statusBox.innerText = "🔒 ブロック中 (アクセス制限オン)";
            statusBox.className = "status-display status-blocked";
            btnBlock.style.display = "none";
            btnUnblock.style.display = "inline-block";
        } else {
            statusBox.innerText = "🟢 通常利用可能";
            statusBox.className = "status-display status-allowed";
            btnBlock.style.display = "inline-block";
            btnUnblock.style.display = "none";
        }

        // パスワードの設定
        if (record.password && !document.getElementById("pwdInput").value) {
            document.getElementById("pwdInput").value = record.password;
        }

        // スケジュールのセット (初期フォーカス時以外のみ上書き)
        if (record.schedules) {
            days.forEach(day => {
                const sched = record.schedules[day] || {};
                const maxEl = document.getElementById(`max_${day}`);
                const startEl = document.getElementById(`start_${day}`);
                const endEl = document.getElementById(`end_${day}`);

                if (document.activeElement !== maxEl) maxEl.value = sched.max_minutes || 0;
                if (document.activeElement !== startEl) startEl.value = (sched.deny_start && sched.deny_start !== "none") ? sched.deny_start : "";
                if (document.activeElement !== endEl) endEl.value = (sched.deny_end && sched.deny_end !== "none") ? sched.deny_end : "";
            });
        }
    }

    // 4. ブロック / 解除ボタンの処理
    async function setBlockState(blockState) {
        currentRecord.is_blocked = blockState;
        currentRecord.manual_override = true; // 手動操作フラグを立てる

        await pushConfig(currentRecord);
        updateUI(currentRecord);
    }

    // 5. 遠隔シャットダウン命令の送信
    async function triggerRemoteShutdown() {
        if (confirm("ラズパイを遠隔で電源オフ（シャットダウン）しますか？")) {
            currentRecord.is_shutdown = true;
            currentRecord.remote_action = "shutdown";
            await pushConfig(currentRecord);
            alert("シャットダウン命令を送信しました。ラズパイがまもなく電源オフになります。");
        }
    }

    // 6. 設定の全体保存
    async function saveConfig() {
        currentRecord.password = document.getElementById("pwdInput").value || "0525";

        const newSchedules = {};
        days.forEach(day => {
            const maxMins = parseInt(document.getElementById(`max_${day}`).value) || 0;
            const startVal = document.getElementById(`start_${day}`).value || "none";
            const endVal = document.getElementById(`end_${day}`).value || "none";

            newSchedules[day] = {
                max_minutes: maxMins,
                deny_start: startVal,
                deny_end: endVal
            };
        });

        currentRecord.schedules = newSchedules;
        
        await pushConfig(currentRecord);
        alert("設定を送信・更新しました！");
    }

    // 7. JSONBin へのPUTデータ送信
    async function pushConfig(data) {
        try {
            await fetch(API_URL, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": API_KEY
                },
                body: JSON.stringify(data)
            });
        } catch (err) {
            console.error("Save error:", err);
            alert("保存に失敗しました。");
        }
    }

    // 初期化と3秒周期のリアルタイム同期スタート
    buildScheduleTable();
    fetchConfig();
    setInterval(fetchConfig, 3000); // 3秒ごとに自動更新
</script>

</body>
</html>
