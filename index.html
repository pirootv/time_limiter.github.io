<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保護者管理ダッシュボード</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 15px; background-color: #1a1a2e; color: white; }
        
        /* ヘッダー周りの重複・重なり修正 */
        .header-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #0f3460; padding-bottom: 12px; }
        h1 { color: #00b4d8; font-size: 20px; margin: 0; word-break: break-all; }
        .logout-btn { background-color: #e94560; color: white; padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }

        .card { background-color: #16213e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: #00b4d8; font-size: 18px; margin-top: 0; margin-bottom: 15px; border-left: 4px solid #00b4d8; padding-left: 10px; }
        .usage-box { background-color: #0f3460; padding: 15px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #90e0ef; }
        
        .ctrl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .btn { padding: 14px 15px; font-size: 15px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; width: 100%; text-align: center; transition: 0.2s; }
        .btn-block { background-color: #e94560; color: white; }
        .btn-allow { background-color: #2ecc71; color: white; }
        .btn-apply { background-color: #00b4d8; color: white; font-size: 18px; padding: 16px; width: 100%; border-radius: 8px; margin-top: 15px; cursor: pointer; border: none; }
        
        input[type="text"], input[type="password"], input[type="number"], input[type="time"] { 
            padding: 10px; background-color: #0f3460; border: 1px solid #00b4d8; color: white; border-radius: 6px; font-size: 15px; outline: none; width: 100%; max-width: 100%;
        }

        /* テーブルおよびスマホ用表示の飛び出し防止修正 */
        .responsive-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .responsive-table th, .responsive-table td { padding: 12px 8px; border: 1px solid #0f3460; text-align: center; font-size: 15px; }
        .responsive-table th { background-color: #0f3460; color: #90e0ef; }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        .login-card { background-color: #16213e; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }

        @media (max-width: 767px) {
            .responsive-table, .responsive-table thead, .responsive-table tbody, .responsive-table th, .responsive-table td, .responsive-table tr { display: block; width: 100%; }
            .responsive-table thead { display: none; }
            .responsive-table tr { background-color: #0f3460; border-radius: 8px; padding: 12px; margin-bottom: 12px; border-left: 4px solid #00b4d8; }
            .responsive-table td { display: flex; justify-content: space-between; align-items: center; border: none; padding: 8px 0; text-align: right; gap: 10px; }
            .responsive-table td:first-child { font-weight: bold; font-size: 16px; color: #90e0ef; border-bottom: 1px solid #16213e; margin-bottom: 8px; padding-bottom: 8px; justify-content: flex-start; }
            .responsive-table td::before { content: attr(data-label); font-weight: bold; color: #ffffff; text-align: left; white-space: nowrap; }
            .responsive-table input { width: 130px !important; text-align: right; }
        }
    </style>
</head>
<body>

    <!-- ログイン画面 -->
    <div id="login-screen">
        <div class="login-card">
            <h1 style="margin-bottom: 20px;">保護者認証</h1>
            <div id="login-error" style="color: #e94560; margin-bottom: 10px; display: none;">パスワードが違います</div>
            <input type="password" id="input-pass" placeholder="パスワードを入力" style="width:100%; margin-bottom:15px; text-align:center;">
            <button class="btn btn-apply" onclick="checkLogin()" style="margin-top:0;">ログイン</button>
        </div>
    </div>

    <!-- メインダッシュボード -->
    <div id="main-screen" style="display: none;">
        <div class="header-bar">
            <h1>保護者管理ダッシュボード</h1>
            <button onclick="logout()" class="logout-btn">ログアウト</button>
        </div>

        <div class="card">
            <h2>📊 本日の利用状況</h2>
            <div class="usage-box">
                本日の利用時間: <span id="used-minutes">0</span> 分 (<span id="used-seconds">0</span> 秒)
            </div>
        </div>

        <div class="card">
            <h2>即時コントロール</h2>
            <div class="ctrl-grid">
                <button onclick="sendAction('block')" class="btn btn-block">全画面ブロック</button>
                <button onclick="sendAction('allow')" class="btn btn-allow">ブロック解除</button>
            </div>
        </div>

        <div class="card">
            <h2>パスワード・スケジュール設定</h2>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px;">パスワード設定: </label>
                <input type="text" id="cfg-password">
            </div>
            <table class="responsive-table">
                <thead>
                    <tr><th>曜日</th><th>1日の最大利用時間</th><th>不可（開始）</th><th>不可（終了）</th></tr>
                </thead>
                <tbody id="schedule-tbody"></tbody>
            </table>
            <button onclick="saveScheduleConfig()" class="btn btn-apply">🚀 設定を保存して適用</button>
        </div>
    </div>

    <script>
        const BIN_ID = "6a8ed91cda38895dfe130781";
        const API_KEY = "$2a$10$cYHxQFVmqDI0vyGYEnYs4.UnliXoDQjli24.bTC0u0p3NZehV.uMG";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let currentConfig = {};
        const daysMap = [
            { code: 'Mon', name: '月曜日' }, { code: 'Tue', name: '火曜日' },
            { code: 'Wed', name: '水曜日' }, { code: 'Thu', name: '木曜日' },
            { code: 'Fri', name: '金曜日' }, { code: 'Sat', name: '土曜日' },
            { code: 'Sun', name: '日曜日' }
        ];

        async function fetchCloudData() {
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                if (!res.ok) return null;
                const data = await res.json();
                return data.record;
            } catch (e) {
                console.error("Fetch Error:", e);
                return null;
            }
        }

        async function updateCloudData(newData) {
            try {
                await fetch(API_URL, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify(newData)
                });
            } catch (e) {
                console.error("Update Error:", e);
            }
        }

        async function checkLogin() {
            const pwd = document.getElementById("input-pass").value;
            const data = await fetchCloudData();
            if (data && pwd === data.password) {
                currentConfig = data;
                sessionStorage.setItem("auth", "true");
                showMainScreen();
            } else {
                document.getElementById("login-error").style.display = "block";
            }
        }

        function logout() {
            sessionStorage.removeItem("auth");
            location.reload();
        }

        function showMainScreen() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("main-screen").style.display = "block";
            renderForm();
            startSyncLoop();
        }

        function renderForm() {
            document.getElementById("cfg-password").value = currentConfig.password || "0525";
            const tbody = document.getElementById("schedule-tbody");
            tbody.innerHTML = "";

            daysMap.forEach(d => {
                const sched = (currentConfig.schedules && currentConfig.schedules[d.code]) || {};
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td data-label="曜日"><strong>${d.name}</strong></td>
                    <td data-label="最大利用(分)"><input type="number" id="max_${d.code}" value="${sched.max_minutes || 0}" min="0"></td>
                    <td data-label="不可（開始）"><input type="time" id="start_${d.code}" value="${sched.deny_start || '21:00'}"></td>
                    <td data-label="不可（終了）"><input type="time" id="end_${d.code}" value="${sched.deny_end || '09:00'}"></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function sendAction(actionType) {
            const data = await fetchCloudData();
            if (data) currentConfig = data;
            
            if (actionType === 'block') {
                currentConfig.is_blocked = true;
                currentConfig.manual_override = true;
            } else if (actionType === 'allow') {
                currentConfig.is_blocked = false;
                currentConfig.manual_override = true;
            }
            await updateCloudData(currentConfig);
            alert(actionType === 'block' ? 'ブロック指示を送信しました' : 'ブロック解除指示を送信しました');
        }

        async function saveScheduleConfig() {
            const data = await fetchCloudData();
            if (data) currentConfig = data;

            currentConfig.password = document.getElementById("cfg-password").value;
            currentConfig.manual_override = false;
            
            if (!currentConfig.schedules) currentConfig.schedules = {};

            daysMap.forEach(d => {
                currentConfig.schedules[d.code] = {
                    max_minutes: parseInt(document.getElementById(`max_${d.code}`).value) || 0,
                    deny_start: document.getElementById(`start_${d.code}`).value || "",
                    deny_end: document.getElementById(`end_${d.code}`).value || ""
                };
            });

            await updateCloudData(currentConfig);
            alert("設定を保存して適用しました！");
        }

        function startSyncLoop() {
            // 3秒ごとの安定通信サイクル
            setInterval(async () => {
                const data = await fetchCloudData();
                if (data) {
                    currentConfig = data;
                    const sec = data.used_seconds || 0;
                    document.getElementById("used-seconds").innerText = sec;
                    document.getElementById("used-minutes").innerText = Math.floor(sec / 60);
                }
            }, 3000);
        }

        window.onload = () => {
            if (sessionStorage.getItem("auth") === "true") {
                fetchCloudData().then(data => {
                    if (data) {
                        currentConfig = data;
                        showMainScreen();
                    }
                });
            }
        };
    </script>
</body>
</html>
